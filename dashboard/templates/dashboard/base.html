<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}XploitAI Console{% endblock %}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            900: '#0b0f14', // Background
                            800: '#0f1620', // Panel
                            700: '#1f2937',
                            600: '#374151',
                            500: '#6b7280',
                            400: '#9ca3af',
                            300: '#d1d5db',
                            200: '#e5e7eb', // Text
                            100: '#f3f4f6',
                        },
                        accent: {
                            DEFAULT: '#22c55e', // Green
                            hover: '#16a34a',
                        },
                        info: '#38bdf8',
                        warning: '#f59e0b',
                        error: '#ef4444',
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #0b0f14; color: #e5e7eb; }
        [x-cloak] { display: none !important; }
        
        /* Legacy Compatibility for Partials */
        .list-group-item { border-bottom: 1px solid #1f2937; padding: 0.75rem; background-color: transparent; }
        .list-group-item:last-child { border-bottom: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-900 text-gray-200">
    <!-- Navbar -->
    <nav class="border-b border-gray-700 bg-gray-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-accent animate-pulse"></div>
            <a href="{% url 'dashboard_index' %}" class="text-xl font-bold tracking-tight text-white hover:text-accent transition-colors">
                XPLOIT<span class="text-accent">AI</span>_CONSOLE
            </a>
        </div>
        <div class="text-xs text-gray-500 font-mono tracking-widest">SYSTEM_ONLINE</div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 p-6 container mx-auto max-w-7xl">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
