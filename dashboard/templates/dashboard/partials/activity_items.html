{% for action in actions %}
<div class="card mb-3 border-0 shadow-sm hover-shadow transition-all">
    <div class="card-body position-relative p-0">
        <div class="d-flex">
            <!-- Status Indicator Strip -->
            <div class="rounded-start {% if action.status == 'COMPLETED' %}bg-success{% elif action.status == 'FAILED' %}bg-danger{% elif action.status == 'RUNNING' %}bg-primary{% else %}bg-secondary{% endif %}" 
                 style="width: 5px;">
            </div>
            
            <div class="p-3 w-100">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge {% if action.status == 'COMPLETED' %}bg-success{% elif action.status == 'FAILED' %}bg-danger{% elif action.status == 'RUNNING' %}bg-primary{% else %}bg-secondary{% endif %} rounded-pill">
                            {{ action.status }}
                        </span>
                        <h6 class="card-title mb-0 fw-bold text-dark">
                            {{ action.name|default:"Operation" }}
                        </h6>
                    </div>
                    <small class="text-muted font-monospace" title="{{ action.created_at }}">
                        {{ action.created_at|date:"H:i:s" }}
                    </small>
                </div>

                <p class="card-text text-secondary mb-3 small">
                    {{ action.description }}
                </p>

                {% if action.parameters.command %}
                <div class="bg-dark rounded p-2 position-relative">
                    <div class="d-flex justify-content-between align-items-center mb-1 border-bottom border-secondary pb-1">
                        <small class="text-secondary font-monospace" style="font-size: 0.7rem;">COMMAND</small>
                        <i class="bi bi-terminal text-secondary" style="font-size: 0.8rem;"></i>
                    </div>
                    <code class="text-light font-monospace d-block text-break small" style="white-space: pre-wrap;">{{ action.parameters.command }}</code>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% empty %}
<div class="text-center py-5">
    <div class="text-muted opacity-25 mb-3">
        <i class="bi bi-activity display-4"></i>
    </div>
    <p class="text-muted fw-semibold">No operations recorded yet.</p>
</div>
{% endfor %}
