<div class="card mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="card-title mb-0">Mission Control</h5>
    </div>
    <div class="card-body">
        {% if not has_active_target %}
            <div class="alert alert-warning">
                <strong>System Not Ready:</strong>
                No active targets configured.
            </div>
        {% endif %}

        <form action="{% url 'dashboard_start_attack' %}" method="POST" class="row g-3 align-items-end">
            {% csrf_token %}
            <input type="hidden" name="idempotency_key" value="{{ start_idempotency_key }}">
            
            <div class="col-md-4">
                <label for="executorSelect" class="form-label">Attacker Executor</label>
                <select name="executor_id" id="executorSelect" class="form-select">
                    <option value="" selected>Local executor (default)</option>
                    {% for executor in executors %}
                        <option value="{{ executor.id }}" {% if not executor.is_remote_ready %}disabled{% endif %}>
                            {{ executor.name }} ({{ executor.connection_display }})
                            {% if not executor.is_remote_ready %}[OFFLINE]{% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label for="targetSelect" class="form-label">Target System</label>
                <select name="target_id" id="targetSelect" class="form-select" required>
                    <option value="" selected disabled>Select Target...</option>
                    {% for target in active_targets %}
                        <option value="{{ target.id }}" {% if not target.is_active %}disabled{% endif %}>
                            {{ target.name }} ({{ target.base_url|default:target.ip_address }})
                            {% if not target.is_active %}[INACTIVE]{% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <button type="submit" id="startAttackBtn" class="btn btn-danger w-100" disabled>
                    <span class="fw-bold">INITIATE AUTONOMOUS ATTACK</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const executorSelect = document.getElementById('executorSelect');
        const targetSelect = document.getElementById('targetSelect');
        const startBtn = document.getElementById('startAttackBtn');

        function checkReadiness() {
            if (targetSelect.value) {
                startBtn.disabled = false;
            } else {
                startBtn.disabled = true;
            }
        }

        if (executorSelect && targetSelect && startBtn) {
            executorSelect.addEventListener('change', checkReadiness);
            targetSelect.addEventListener('change', checkReadiness);
            // Initial check
            checkReadiness();
        }
    });
</script>
