<div class="divide-y divide-white/5">
    {% for alert in alerts %}
    <div class="px-5 py-4">
        <div class="flex items-start justify-between gap-4">
            <div>
                <h3 class="font-semibold text-white">{{ alert.title }}</h3>
                {% if alert.description %}
                <p class="mt-2 text-sm leading-6 text-slate-400">{{ alert.description }}</p>
                {% endif %}
                <div class="mt-2 text-xs text-slate-500">{{ alert.created_at|timesince }} ago</div>
            </div>
            <span class="ui-badge ui-badge-warning">{{ alert.severity }}</span>
        </div>
    </div>
    {% empty %}
    <div class="px-5 py-8 text-center text-sm text-slate-500">No active alerts.</div>
    {% endfor %}
</div>
