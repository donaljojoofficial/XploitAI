<div class="card shadow-sm">
    <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">Defender Alerts</h5>
        <span class="badge bg-white text-danger">{{ alerts|length }}</span>
    </div>
    <div class="list-group list-group-flush" style="max-height: 300px; overflow-y: auto;">
        {% for alert in alerts %}
        <div class="list-group-item">
            <div class="d-flex w-100 justify-content-between">
                <h6 class="mb-1">{{ alert.title }}</h6>
                <span class="badge bg-warning text-dark">{{ alert.severity }}</span>
            </div>
            <p class="mb-1 small">{{ alert.description }}</p>
            <small class="text-muted">{{ alert.created_at|timesince }} ago</small>
        </div>
        {% empty %}
        <div class="list-group-item text-center text-muted">No active alerts.</div>
        {% endfor %}
    </div>
</div>
